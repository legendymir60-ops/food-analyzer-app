name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build with Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1.3.2
      with:
        work-dir: ./
        buildozer-version: stable
        target: android
        buildozer-command: debug
