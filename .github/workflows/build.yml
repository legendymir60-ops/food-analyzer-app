name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install Buildozer
      run: |
        pip install buildozer
        pip install cython
        
    - name: Build APK
      run: |
        buildozer android debug
      timeout-minutes: 60
