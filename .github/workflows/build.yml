name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build with Buildozer Docker
      run: |
        docker run --rm -it \
          -v $PWD:/src \
          -w /src \
          --env BUILDOZER_ANDROID_ACCEPT_LICENSES=yes \
          kivy/buildozer \
          buildozer android debug
      timeout-minutes: 60
