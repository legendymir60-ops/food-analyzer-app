name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-pip openjdk-11-jdk git
        pip3 install buildozer cython
        
    - name: Build APK (this will take 30-40 minutes)
      run: |
        buildozer android debug
      timeout-minutes: 60
