name: Build Kivy APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Install Python dependencies
      run: |
        pip3 install buildozer cython
        
    - name: Build APK
      run: |
        buildozer android debug
      timeout-minutes: 60
